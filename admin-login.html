<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Sign Up/In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="title-bar">Haas Hall Academy Bentonville Tutoring Program</div>
    <div class="subtitle-bar">Admin Sign Up/In</div>

    <form class="panel" id="login-form">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
    </form>

    <div class="panel hidden" id="not-in-db-panel">
      <p style="color:var(--gold); margin-top:0;">- - - Not In Database - - -</p>
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" placeholder="Leave blank if this was just a typo">
      <p id="pending-msg" class="hidden" style="color:var(--gold); font-weight:bold;">
        Pending / waiting for approval.
      </p>
    </div>

    <button class="btn" id="submit-btn" type="submit" form="login-form">Sign Up/In</button>
    <br><br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

<script>
  // NOTE: this is placeholder front-end logic only. Once Supabase is
  // connected, replace checkCredentials() and checkRequestAlreadySent()
  // with real lookups against the admins table.

  const form = document.getElementById('login-form');
  const notInDbPanel = document.getElementById('not-in-db-panel');
  const fullnameInput = document.getElementById('fullname');
  const pendingMsg = document.getElementById('pending-msg');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');

  let hasFailedOnce = false;
  let pendingRequestSent = false; // becomes true once a name has been submitted

  function checkCredentials(username, password) {
    // Placeholder: always fails for now. Wire this to Supabase later.
    return false;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();
    const fullname = fullnameInput.value.trim();

    const success = checkCredentials(username, password);

    if (success) {
      alert('Signed in! (placeholder — real redirect happens once Supabase is connected)');
      return;
    }

    // Failed attempt
    if (!hasFailedOnce) {
      hasFailedOnce = true;
      notInDbPanel.classList.remove('hidden');
      return;
    }

    // Second+ failure: was the Full Name field left blank (just a typo) or filled (new admin)?
    if (fullname === '') {
      // Just a typo — let them keep correcting username/password.
      return;
    }

    if (pendingRequestSent) {
      pendingMsg.classList.remove('hidden');
      pendingMsg.textContent = 'A request for this name has already been sent. Pending / waiting for approval.';
      return;
    }

    // First-time name submission — fire off the (placeholder) request to all admins.
    pendingRequestSent = true;
    pendingMsg.classList.remove('hidden');
    pendingMsg.textContent = 'Pending / waiting for approval.';
  });
</script>
</body>
</html>
