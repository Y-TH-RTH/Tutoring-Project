<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Log In</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="container">
    <div class="title-bar">Haas Hall Academy Bentonville Tutoring Program</div>
    <div class="subtitle-bar">Parent Sign In</div>

    <form class="panel" id="login-form">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required autocomplete="username">
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
      <div class="check-group">
        <label><input type="checkbox" id="show-password"> Show password</label>
      </div>
    </form>

    <div class="panel hidden" id="not-found-panel">
      <p style="color:var(--gold); font-weight:bold; margin:0;">
        Username or password not found. Contact the tutoring program if this is incorrect.
      </p>
    </div>

    <button class="btn" id="submit-btn" type="submit" form="login-form">Sign In</button>
    <br><br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

<script>
  const SUPABASE_URL = 'https://qdjgnxvomzukvsxjrhen.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkamdueHZvbXp1a3ZzeGpyaGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzU5OTUsImV4cCI6MjEwNTYxMTk5NX0.H_Qc5zuK1TMslOFuFTXa0rZg-JVDJZtuvanQySwkD84';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('login-form');
  const notFoundPanel = document.getElementById('not-found-panel');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    notFoundPanel.classList.add('hidden');
    submitBtn.disabled = true;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    const { data, error } = await db.rpc('parent_login', {
      p_username: username,
      p_password: password
    });

    submitBtn.disabled = false;

    if (error) {
      console.error(error);
      notFoundPanel.classList.remove('hidden');
      return;
    }

    const match = data && data.length > 0 ? data[0] : null;
    if (!match) {
      notFoundPanel.classList.remove('hidden');
      return;
    }

    // Store only what the dashboard needs. The password is never stored.
    sessionStorage.setItem('parent_session', JSON.stringify({
      scholar_name: match.scholar_name,
      grade: match.grade,
      attended_dates: match.attended_dates || [],
      username: username
    }));
    window.location.href = 'parents-dashboard.html';
  });

  // Show/hide password toggle
  document.getElementById('show-password').addEventListener('change', function () {
    document.getElementById('password').type = this.checked ? 'text' : 'password';
  });
</script>
</body>
</html>
