<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parent Log In</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="title-bar">Haas Hall Academy Bentonville Tutoring Program</div>
    <div class="subtitle-bar">Parent Sign In</div>

    <form class="panel" id="login-form">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
    </form>

    <button class="btn" id="submit-btn" type="submit" form="login-form">Sign In</button>
    <br><br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

<script>
  // No login logic yet: any username/password goes straight to the dashboard.
  document.getElementById('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'parents-dashboard.html';
  });
</script>
</body>
</html>
