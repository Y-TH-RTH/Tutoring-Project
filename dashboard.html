<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admins</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  .sheet-table { width:100%; border-collapse:collapse; }
  .sheet-table th, .sheet-table td {
    border: 1px solid var(--line);
    padding: 8px 10px;
    font-size: 0.9rem;
    text-align: left;
  }
  .sheet-table th { background: var(--bg); color: var(--ink-soft); font-weight:600; font-size:0.8rem; }
  .sheet-table td[contenteditable="true"] { cursor: text; }
  .sheet-table td[contenteditable="true"]:focus {
    outline: 2px solid var(--blue);
    outline-offset: -2px;
    background: var(--blue-soft);
  }
  .sheet-table td.attendance-y { color: #15803d; font-weight:700; text-align:center; }
  .sheet-table td.attendance-n { color: var(--ink-soft); text-align:center; }
  .row-delete { background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:1rem; }
  .row-delete:hover { color:#b91c1c; }
  .sheet-wrap { overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:10px; }
  .week-label { color: var(--ink-soft); font-size:0.85rem; margin: 6px 0 10px; }
  .save-flash { transition: background 0.6s ease; }
  .btn:disabled, .btn[disabled] {
    opacity: 0.45;
    cursor: not-allowed;
    background: var(--ink-soft) !important;
  }
  .btn:disabled:hover, .btn[disabled]:hover { background: var(--ink-soft) !important; }
  .searchable-select { position: relative; margin-top: 6px; }
  .searchable-select .ss-input {
    width: 100%; padding: 11px 13px; border-radius: 9px;
    border: 1px solid var(--line); font-family: inherit; font-size: 0.95rem;
  }
  .ss-panel {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 20;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    max-height: 220px; overflow-y: auto; box-shadow: 0 8px 24px rgba(22,24,29,0.15);
    margin-top: 4px;
  }
  .ss-group-label {
    padding: 6px 12px; font-size: 0.75rem; font-weight: 700; color: var(--ink-soft);
    background: var(--bg); text-transform: uppercase;
  }
  .ss-option { padding: 8px 14px; cursor: pointer; font-size: 0.9rem; }
  .ss-option:hover { background: var(--blue-soft); }
</style>
</head>
<body>
  <div class="container wide">
    <div class="title-bar">Haas Hall Academy Bentonville Tutoring Program</div>
    <div class="subtitle-bar">Admins</div>
    <div id="session-bar" style="color:var(--ink-soft); font-size:0.85rem; margin:-6px 0 10px; text-align:right;"></div>

    <div class="dash-columns">
      <div>
        <div class="tabs">
          <button class="tab active" data-tab="scholars">Scholars</button>
          <button class="tab" data-tab="aip">AIP Scholars</button>
        </div>
        <div class="week-label" id="week-label"></div>
        <div class="sheet-wrap">
          <table class="sheet-table" id="scholars-table">
            <thead>
              <tr><th>Last Name</th><th>First Name</th><th>Attendance</th><th></th></tr>
            </thead>
            <tbody id="scholars-body"></tbody>
          </table>
          <table class="sheet-table hidden" id="aip-table">
            <thead>
              <tr><th>Last Name</th><th>First Name</th><th>Grade Level</th><th>Teacher & Class</th><th>Grade in Class (%)</th><th>Attendance</th><th></th></tr>
            </thead>
            <tbody id="aip-body"></tbody>
          </table>
        </div>
      </div>

      <div class="side-buttons">
        <button class="btn" id="btn-add-aip">Add AIP Scholars</button>
        <button class="btn" id="btn-edit-tutors">Edit Tutors</button>
        <button class="btn" id="btn-review-apps">Review Applications</button>
        <button class="btn" id="btn-edit-admins">Edit Admins</button>
      </div>
    </div>

    <br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

  <!-- Add AIP Scholars modal -->
  <div class="modal-overlay hidden" id="modal-add-aip">
    <div class="modal">
      <h3>Add AIP Scholar</h3>
      <form id="aip-add-form">
        <label>Last Name:</label>
        <input type="text" name="last_name" required>
        <label>First Name:</label>
        <input type="text" name="first_name" required>
        <label>Grade Level:</label>
        <select name="grade">
          <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        </select>
        <label>Teacher:</label>
        <select name="teacher" id="aip-teacher-select">
          <option value="self">Self</option>
        </select>
        <label>Subject:</label>
        <div class="searchable-select" id="aip-subject-searchable">
          <input type="text" class="ss-input" placeholder="Type to search subjects..." autocomplete="off">
          <input type="hidden" name="class_name" required>
          <div class="ss-panel hidden"></div>
        </div>
        <label>Grade in Class (%):</label>
        <input type="number" name="start_grade" step="0.01" min="0" max="100" placeholder="e.g. 69.32" required>
        <br><br>
        <button class="btn" type="submit">Add Scholar</button>
        <button class="btn secondary" type="button" onclick="closeModal('modal-add-aip')">Cancel</button>
      </form>
    </div>
  </div>

  <!-- Edit Tutors modal -->
  <div class="modal-overlay hidden" id="modal-tutors">
    <div class="modal" style="max-width:560px;">
      <h3>Edit Tutors</h3>
      <div class="tabs" style="margin-bottom:14px;">
        <button class="tab active" id="tab-tutors-remove" type="button">Remove/Edit Tutors</button>
        <button class="tab" id="tab-tutors-add" type="button">Add New Tutor</button>
      </div>

      <div id="panel-tutors-remove">
        <div style="max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; margin-bottom:10px;">
          <table class="sheet-table" style="margin-bottom:0;">
            <thead><tr><th>Full Name</th><th>Day</th><th>Room</th><th>Role</th><th></th></tr></thead>
            <tbody id="tutors-list-body"></tbody>
          </table>
        </div>
      </div>

      <div id="panel-tutors-add" class="hidden">
        <form id="add-tutor-form">
          <label>Full Name:</label>
          <input type="text" name="full_name" required>
          <label>Day Assigned:</label>
          <select name="day_assigned">
            <option>Tuesday</option><option>Wednesday</option><option>Thursday</option>
          </select>
          <label>Room Assigned:</label>
          <select name="room_assigned">
            <option>Upper</option><option>Lower</option>
          </select>
          <label>Role:</label>
          <select name="role">
            <option>Tutor</option><option>Room Lead</option><option>President</option>
          </select>
          <br><br>
          <button class="btn" type="submit">Add Tutor</button>
        </form>
      </div>

      <br>
      <button class="btn secondary" type="button" onclick="closeModal('modal-tutors')">Close</button>
    </div>
  </div>

  <!-- Review Applications modal -->
  <div class="modal-overlay hidden" id="modal-apps">
    <div class="modal" style="max-width:640px;">
      <h3>Review Applications</h3>
      <div class="tabs" style="margin-bottom:14px;">
        <button class="tab active" id="tab-apps-review" type="button">Review Recommendations</button>
        <button class="tab hidden" id="tab-apps-finalize" type="button">Finalize Application</button>
      </div>

      <div id="panel-apps-review" style="max-height:400px; overflow-y:auto;"></div>
      <div id="panel-apps-finalize" class="hidden" style="max-height:400px; overflow-y:auto;"></div>

      <br>
      <button class="btn secondary" type="button" onclick="closeModal('modal-apps')">Close</button>
    </div>
  </div>

  <!-- Edit Admins modal -->
  <div class="modal-overlay hidden" id="modal-admins">
    <div class="modal" style="max-width:520px;">
      <h3>Edit Admins</h3>
      <div class="tabs" style="margin-bottom:14px;">
        <button class="tab active" id="tab-admins-remove" type="button">Remove/Edit Admins</button>
        <button class="tab" id="tab-admins-add" type="button">Add New Admin</button>
      </div>

      <div id="panel-admins-remove">
        <div style="max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; margin-bottom:10px;">
          <table class="sheet-table" id="admins-list-table" style="margin-bottom:0;">
            <thead><tr><th>Full Name</th><th>Username</th><th>Role</th><th></th></tr></thead>
            <tbody id="admins-list-body"></tbody>
          </table>
        </div>
      </div>

      <div id="panel-admins-add" class="hidden">
        <form id="add-admin-form">
          <label>Full Name:</label>
          <input type="text" name="full_name" required>
          <label>Role:</label>
          <select name="role">
            <option value="Admin">Admin</option>
            <option value="Head Admin">Head Admin</option>
          </select>
          <br><br>
          <button class="btn" type="submit">Add Admin</button>
        </form>
      </div>

      <br>
      <button class="btn secondary" type="button" onclick="closeModal('modal-admins')">Close</button>
    </div>
  </div>

<script>
  /* ---------- Supabase connection ---------- */
  const SUPABASE_URL = 'https://qdjgnxvomzukvsxjrhen.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkamdueHZvbXp1a3ZzeGpyaGVuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMzU5OTUsImV4cCI6MjEwNTYxMTk5NX0.H_Qc5zuK1TMslOFuFTXa0rZg-JVDJZtuvanQySwkD84';
  const { createClient } = supabase;
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ---------- Session gate ---------- */
  const adminSessionRaw = sessionStorage.getItem('admin_session');
  if (!adminSessionRaw) {
    window.location.href = 'admin-login.html';
  }
  const adminSession = JSON.parse(adminSessionRaw || '{}');

  document.getElementById('session-bar').innerHTML =
    `Logged in as ${adminSession.full_name} (${adminSession.role}) &nbsp;|&nbsp; ` +
    `<a href="#" id="logout-link" style="color:var(--blue);">Log out</a>`;
  document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    sessionStorage.removeItem('admin_session');
    window.location.href = 'home.html';
  });

  // How many visits/week counts as "attending" for each roster.
  const AIP_VISITS_FOR_Y = 2;
  const REGULAR_VISITS_FOR_Y = 1;

  const TEACHERS = [
    'Depner', 'Levings', 'Stringfellow', 'Greenwood', 'Riggs', 'DeSpain',
    'Longanecker', 'Pearce', 'Still', 'Powell', 'Passmore', 'Gilbert',
    'Golden', 'Ingram', 'Hamlin', 'Karras', 'Brophy', 'Smiley',
    'Parker', 'Turnbaugh', 'Cashion'
  ];
  const teacherSelect = document.querySelector('#aip-add-form select[name="teacher"]');
  TEACHERS.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    teacherSelect.appendChild(opt);
  });

  // Same grouped subject list as applications.html — order and headings preserved
  const CLASS_GROUPS = {
    'Math': ['Pre-Algebra', 'Algebra 1', 'Algebra 2', 'Geometry', 'Precalc/Trig', 'AP Precalc', 'Calculus', 'AP Calc AB', 'AP Calc BC', 'AP Stats'],
    'English': ['7 English', '8 English', 'English I', 'English II', 'English III w/ Personal Comm', 'AP Lang', 'AP Lit', 'AP Seminar', 'AP Research', 'Journalism'],
    'Science': ['7 Science', '8 Science', 'Physical Science', 'Physics', 'AP Physics C', 'Biology', 'AP Bio', 'AP Environmental Science', 'Chemistry', 'Chemistry 2', 'Chemistry of Foods'],
    'Computer Science': ['8 KC', 'Intro to Comp Sci', 'AP CSP', 'AP CSA', 'Game Development'],
    'Social Studies': ['7 SS', '8 SS', 'Civics/Econ', 'AP US Gov', 'AP Micro/Macro', 'Intro to Crim', 'CSI', 'World History', 'AP World', 'US History', 'APUSH', 'AP Psych', 'AP Business'],
    'Health Sciences': ['7 Career', '7 Health', '7 PE', '8 Health', '8 PE', 'Health', 'A&P', 'Med Term', 'Recreational Sports', 'College & Career', 'Personal Fitness'],
    'Fine Arts': ['7 Theatre', '7 Art', '8 Art', 'Drawing 1', 'Painting 1', 'Visual Art Foundations 1', 'Sculpture', 'Studio Art', 'AP Art History'],
    'World Languages': ['Spanish 1', 'Spanish 2', 'Spanish 3', 'AP Spanish Lang', 'French 3', 'AP French Lang']
  };

  // Reusable searchable single-select. containerEl needs .ss-input, a
  // hidden input, and a .ss-panel inside it. Keeps group order/headings.
  function makeSearchableSelect(containerEl, groups) {
    const input = containerEl.querySelector('.ss-input');
    const hidden = containerEl.querySelector('input[type="hidden"]');
    const panel = containerEl.querySelector('.ss-panel');

    function renderPanel(filterText) {
      const f = filterText.trim().toLowerCase();
      panel.innerHTML = '';
      let anyMatch = false;
      Object.entries(groups).forEach(([groupName, items]) => {
        const matches = items.filter(item => item.toLowerCase().includes(f));
        if (matches.length === 0) return;
        anyMatch = true;
        const label = document.createElement('div');
        label.className = 'ss-group-label';
        label.textContent = groupName;
        panel.appendChild(label);
        matches.forEach(item => {
          const opt = document.createElement('div');
          opt.className = 'ss-option';
          opt.textContent = item;
          opt.addEventListener('mousedown', (e) => {
            e.preventDefault();
            input.value = item;
            hidden.value = item;
            panel.classList.add('hidden');
          });
          panel.appendChild(opt);
        });
      });
      if (!anyMatch) {
        panel.innerHTML = '<div class="ss-option" style="color:var(--ink-soft);">No matches</div>';
      }
      panel.classList.remove('hidden');
    }

    input.addEventListener('focus', () => renderPanel(input.value));
    input.addEventListener('input', () => {
      hidden.value = ''; // force an explicit pick before submit is valid
      renderPanel(input.value);
    });
    input.addEventListener('blur', () => {
      setTimeout(() => panel.classList.add('hidden'), 100);
    });
  }

  makeSearchableSelect(document.getElementById('aip-subject-searchable'), CLASS_GROUPS);

  function pad(n) { return n.toString().padStart(2, '0'); }
  function toISODate(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
  function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
  function normalizeName(n) { return n.trim().toLowerCase().replace(/\s+/g, ' '); }

  function getWeekRange(d) {
    const day = d.getDay(); // 0 = Sun .. 6 = Sat
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(d);
    monday.setDate(d.getDate() + diffToMonday);
    monday.setHours(0, 0, 0, 0);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    return { monday, sunday };
  }

  const { monday, sunday } = getWeekRange(new Date());
  document.getElementById('week-label').textContent =
    'Attendance for week of ' + toISODate(monday) + ' – ' + toISODate(sunday);

  /* ---------- Tab switching ---------- */
  const tabs = document.querySelectorAll('.tab');
  const scholarsTable = document.getElementById('scholars-table');
  const aipTable = document.getElementById('aip-table');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if (tab.dataset.tab === 'scholars') {
        scholarsTable.classList.remove('hidden');
        aipTable.classList.add('hidden');
      } else {
        aipTable.classList.remove('hidden');
        scholarsTable.classList.add('hidden');
      }
    });
  });

  /* ---------- Editable cell helper ---------- */
  // Attaches a save-on-blur handler to a contenteditable <td>.
  function makeEditable(td, table, id, field) {
    td.contentEditable = 'true';
    let original = td.textContent;
    td.addEventListener('focus', () => { original = td.textContent; });
    td.addEventListener('blur', async () => {
      const value = td.textContent.trim();
      if (value === original) return;
      const { error } = await db.from(table).update({ [field]: value }).eq('id', id);
      if (error) {
        alert('Could not save that change: ' + error.message);
        td.textContent = original;
        return;
      }
      td.style.background = '#dcfce7';
      setTimeout(() => { td.style.background = ''; }, 600);
    });
  }

  function makeDeleteButton(table, id, onDeleted) {
    const btn = document.createElement('button');
    btn.className = 'row-delete';
    btn.textContent = '✕';
    btn.title = 'Remove';
    btn.addEventListener('click', async () => {
      if (!confirm('Remove this row?')) return;
      const { error } = await db.from(table).delete().eq('id', id);
      if (error) { alert('Could not delete: ' + error.message); return; }
      onDeleted();
    });
    return btn;
  }

  /* ---------- Load everything ---------- */
  async function loadDashboard() {
    // Weekly session log, used to compute attendance for both tabs.
    const { data: sessions, error: sessionsErr } = await db
      .from('scholars')
      .select('full_name, session_date')
      .gte('session_date', toISODate(monday))
      .lte('session_date', toISODate(sunday));

    if (sessionsErr) console.error('Could not load session log:', sessionsErr);

    const weeklyCounts = {}; // normalized name -> visit count this week
    (sessions || []).forEach(s => {
      const key = normalizeName(s.full_name || '');
      if (!key) return;
      weeklyCounts[key] = (weeklyCounts[key] || 0) + 1;
    });

    const { data: aipRows, error: aipErr } = await db
      .from('aip_list')
      .select('*')
      .order('last_name', { ascending: true });
    if (aipErr) { console.error(aipErr); alert('Could not load AIP Scholars: ' + aipErr.message); }

    const aipNameSet = new Set(
      (aipRows || []).map(r => normalizeName(`${r.first_name} ${r.last_name}`))
    );

    renderAipTable(aipRows || [], weeklyCounts);

    // Regular scholars roster — auto-add anyone who showed up in the
    // session log this week (ever, in this simple version) and isn't AIP.
    const { data: scholarRows, error: scholarErr } = await db
      .from('scholar_roster')
      .select('*');
    if (scholarErr) console.error(scholarErr);

    const existingScholarNames = new Set(
      (scholarRows || []).map(r => normalizeName(`${r.first_name} ${r.last_name}`))
    );

    const toInsert = [];
    Object.keys(weeklyCounts).forEach(key => {
      if (aipNameSet.has(key) || existingScholarNames.has(key)) return;
      const parts = key.split(' ');
      const first_name = parts[0];
      const last_name = parts.slice(1).join(' ') || '(unknown)';
      toInsert.push({ first_name, last_name });
    });

    let finalScholarRows = scholarRows || [];
    if (toInsert.length > 0) {
      const { data: inserted, error: insertErr } = await db
        .from('scholar_roster')
        .insert(toInsert)
        .select();
      if (insertErr) {
        console.error('Could not auto-add new scholars:', insertErr);
      } else {
        finalScholarRows = finalScholarRows.concat(inserted || []);
      }
    }

    renderScholarsTable(finalScholarRows, weeklyCounts);
  }

  function attendanceCell(count, threshold) {
    const td = document.createElement('td');
    if (count >= threshold) {
      td.textContent = 'Y';
      td.className = 'attendance-y';
    } else {
      td.textContent = 'No';
      td.className = 'attendance-n';
    }
    return td;
  }

  function renderAipTable(rows, weeklyCounts) {
    const body = document.getElementById('aip-body');
    body.innerHTML = '';
    rows.forEach(row => {
      const tr = document.createElement('tr');

      const lastTd = document.createElement('td');
      lastTd.textContent = row.last_name || '';
      makeEditable(lastTd, 'aip_list', row.id, 'last_name');

      const firstTd = document.createElement('td');
      firstTd.textContent = row.first_name || '';
      makeEditable(firstTd, 'aip_list', row.id, 'first_name');

      const gradeTd = document.createElement('td');
      gradeTd.textContent = row.grade || '';
      makeEditable(gradeTd, 'aip_list', row.id, 'grade');

      const teacherClassTd = document.createElement('td');
      teacherClassTd.textContent = row.teacher_class || '';
      makeEditable(teacherClassTd, 'aip_list', row.id, 'teacher_class');

      const startGradeTd = document.createElement('td');
      startGradeTd.textContent = (row.start_grade !== null && row.start_grade !== undefined) ? Number(row.start_grade).toFixed(2) : '';
      makeEditable(startGradeTd, 'aip_list', row.id, 'start_grade');

      const key = normalizeName(`${row.first_name} ${row.last_name}`);
      const count = weeklyCounts[key] || 0;
      const attTd = attendanceCell(count, AIP_VISITS_FOR_Y);

      const delTd = document.createElement('td');
      delTd.appendChild(makeDeleteButton('aip_list', row.id, () => tr.remove()));

      tr.append(lastTd, firstTd, gradeTd, teacherClassTd, startGradeTd, attTd, delTd);
      body.appendChild(tr);
    });
  }

  function renderScholarsTable(rows, weeklyCounts) {
    const body = document.getElementById('scholars-body');
    body.innerHTML = '';
    rows
      .slice()
      .sort((a, b) => (a.last_name || '').localeCompare(b.last_name || ''))
      .forEach(row => {
        const tr = document.createElement('tr');

        const lastTd = document.createElement('td');
        lastTd.textContent = row.last_name || '';
        makeEditable(lastTd, 'scholar_roster', row.id, 'last_name');

        const firstTd = document.createElement('td');
        firstTd.textContent = row.first_name || '';
        makeEditable(firstTd, 'scholar_roster', row.id, 'first_name');

        const key = normalizeName(`${row.first_name} ${row.last_name}`);
        const count = weeklyCounts[key] || 0;
        const attTd = attendanceCell(count, REGULAR_VISITS_FOR_Y);

        const delTd = document.createElement('td');
        delTd.appendChild(makeDeleteButton('scholar_roster', row.id, () => tr.remove()));

        tr.append(lastTd, firstTd, attTd, delTd);
        body.appendChild(tr);
      });
  }

  loadDashboard();

  /* ---------- Add AIP Scholar modal ---------- */
  document.getElementById('btn-add-aip').addEventListener('click', () => openModal('modal-add-aip'));

  document.getElementById('aip-add-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const fd = new FormData(e.target);

    if (!fd.get('class_name')) {
      alert('Pick a subject from the search list before submitting.');
      return;
    }

    let teacherValue = fd.get('teacher');
    if (teacherValue === 'self') {
      // Derive from the logged-in admin's own name rather than the dropdown
      const parts = adminSession.full_name.trim().split(' ');
      teacherValue = parts[parts.length - 1]; // last name, matching the TEACHERS list style
    }

    const row = {
      last_name: fd.get('last_name').trim(),
      first_name: fd.get('first_name').trim(),
      grade: fd.get('grade'),
      teacher_class: `${teacherValue} – ${fd.get('class_name').trim()}`,
      start_grade: parseFloat(fd.get('start_grade'))
    };
    const { error } = await db.from('aip_list').insert([row]);
    if (error) {
      alert('Could not add scholar: ' + error.message);
      return;
    }
    e.target.reset();
    closeModal('modal-add-aip');
    loadDashboard();
  });

  /* ---------- Gate Edit Tutors to Head Admin only ---------- */
  const isHeadAdmin = lower(adminSession.role) === 'head admin';
  function lower(s) { return (s || '').toLowerCase(); }
  const editTutorsBtn = document.getElementById('btn-edit-tutors');
  if (!isHeadAdmin) {
    editTutorsBtn.disabled = true;
    editTutorsBtn.title = 'Head Admin only';
  }

  const editAdminsBtn = document.getElementById('btn-edit-admins');
  if (!isHeadAdmin) {
    editAdminsBtn.disabled = true;
    editAdminsBtn.title = 'Head Admin only';
  }

  /* ---------- Small tab-switcher helper reused for all 3 modals ---------- */
  function wireTabs(tabIds, panelIds) {
    tabIds.forEach((tabId, i) => {
      document.getElementById(tabId).addEventListener('click', () => {
        tabIds.forEach((t, j) => document.getElementById(t).classList.toggle('active', j === i));
        panelIds.forEach((p, j) => document.getElementById(p).classList.toggle('hidden', j !== i));
      });
    });
  }
  wireTabs(['tab-admins-remove', 'tab-admins-add'], ['panel-admins-remove', 'panel-admins-add']);
  wireTabs(['tab-tutors-remove', 'tab-tutors-add'], ['panel-tutors-remove', 'panel-tutors-add']);
  wireTabs(['tab-apps-review', 'tab-apps-finalize'], ['panel-apps-review', 'panel-apps-finalize']);
  if (isHeadAdmin) document.getElementById('tab-apps-finalize').classList.remove('hidden');

  /* ================= EDIT ADMINS ================= */
  async function loadAdminsList() {
    const { data, error } = await db.rpc('list_admins');
    const body = document.getElementById('admins-list-body');
    body.innerHTML = '';
    if (error) { console.error(error); body.innerHTML = '<tr><td colspan="4">Could not load admins.</td></tr>'; return; }
    (data || []).forEach(row => {
      const tr = document.createElement('tr');

      const roleTd = document.createElement('td');
      const roleSel = document.createElement('select');
      ['Admin', 'Head Admin'].forEach(r => {
        const opt = document.createElement('option');
        opt.value = r; opt.textContent = r;
        if (r === row.role) opt.selected = true;
        roleSel.appendChild(opt);
      });
      roleSel.addEventListener('change', async () => {
        const confirmUsername = prompt('Enter a Head Admin username to confirm this role change:');
        if (!confirmUsername) { roleSel.value = row.role; return; }
        const confirmPassword = prompt('Enter that Head Admin\'s password:');
        if (!confirmPassword) { roleSel.value = row.role; return; }
        const { error: roleErr } = await db.rpc('admin_update_role', {
          p_target_full_name: row.full_name, p_new_role: roleSel.value,
          p_confirming_username: confirmUsername, p_confirming_password: confirmPassword
        });
        if (roleErr) { alert('Could not update role: ' + roleErr.message); roleSel.value = row.role; return; }
        row.role = roleSel.value;
      });
      roleTd.appendChild(roleSel);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'row-delete'; removeBtn.textContent = '✕'; removeBtn.title = 'Remove';
      removeBtn.addEventListener('click', async () => {
        if (!confirm(`Remove ${row.full_name}?`)) return;
        const confirmUsername = prompt('Enter a Head Admin username to confirm removal:');
        if (!confirmUsername) return;
        const confirmPassword = prompt('Enter that Head Admin\'s password:');
        if (!confirmPassword) return;
        const { error: removeErr } = await db.rpc('remove', {
          p_target_full_name: row.full_name, p_confirming_username: confirmUsername, p_confirming_password: confirmPassword
        });
        if (removeErr) { alert('Could not remove admin: ' + removeErr.message); return; }
        loadAdminsList();
      });
      const delTd = document.createElement('td');
      delTd.appendChild(removeBtn);

      tr.innerHTML = `<td>${row.full_name}</td><td>${row.username}</td>`;
      tr.appendChild(roleTd);
      tr.appendChild(delTd);
      body.appendChild(tr);
    });
  }

  document.getElementById('btn-edit-admins').addEventListener('click', () => {
    if (!isHeadAdmin) return;
    loadAdminsList();
    openModal('modal-admins');
  });

  document.getElementById('add-admin-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const confirmUsername = prompt('Enter a Head Admin username to confirm this addition:');
    if (!confirmUsername) return;
    const confirmPassword = prompt('Enter that Head Admin\'s password:');
    if (!confirmPassword) return;
    const { data, error } = await db.rpc('add', {
      p_full_name: fd.get('full_name').trim(), p_role: fd.get('role'),
      p_confirming_username: confirmUsername, p_confirming_password: confirmPassword
    });
    if (error) { alert('Could not add admin: ' + error.message); return; }
    const result = data && data[0];
    e.target.reset();
    loadAdminsList();
    if (result) {
      alert(`Admin added!\n\nUsername: ${result.new_username}\nPassword: ${result.new_password}\n\n` +
        `Write this down now — the password can't be retrieved again once you close this.`);
    }
  });

  /* ================= EDIT TUTORS (Head Admin only) ================= */
  async function loadTutorsList() {
    const { data, error } = await db.rpc('list_tutors');
    const body = document.getElementById('tutors-list-body');
    body.innerHTML = '';
    if (error) { console.error(error); body.innerHTML = '<tr><td colspan="5">Could not load tutors.</td></tr>'; return; }
    (data || []).forEach(row => {
      const tr = document.createElement('tr');

      const roleTd = document.createElement('td');
      const roleSel = document.createElement('select');
      ['Tutor', 'Room Lead', 'President'].forEach(r => {
        const opt = document.createElement('option');
        opt.value = r; opt.textContent = r;
        if (r === row.role) opt.selected = true;
        roleSel.appendChild(opt);
      });
      roleSel.addEventListener('change', async () => {
        const confirmUsername = prompt('Enter a Head Admin username to confirm this role change:');
        if (!confirmUsername) { roleSel.value = row.role; return; }
        const confirmPassword = prompt('Enter that Head Admin\'s password:');
        if (!confirmPassword) { roleSel.value = row.role; return; }
        const { error: roleErr } = await db.rpc('tutor_update_role', {
          p_target_full_name: row.full_name, p_new_role: roleSel.value,
          p_confirming_username: confirmUsername, p_confirming_password: confirmPassword
        });
        if (roleErr) { alert('Could not update role: ' + roleErr.message); roleSel.value = row.role; return; }
        row.role = roleSel.value;
      });
      roleTd.appendChild(roleSel);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'row-delete'; removeBtn.textContent = '✕'; removeBtn.title = 'Remove';
      removeBtn.addEventListener('click', async () => {
        if (!confirm(`Remove ${row.full_name}?`)) return;
        const confirmUsername = prompt('Enter a Head Admin username to confirm removal:');
        if (!confirmUsername) return;
        const confirmPassword = prompt('Enter that Head Admin\'s password:');
        if (!confirmPassword) return;
        const { error: removeErr } = await db.rpc('tutor_remove', {
          p_target_full_name: row.full_name, p_confirming_username: confirmUsername, p_confirming_password: confirmPassword
        });
        if (removeErr) { alert('Could not remove tutor: ' + removeErr.message); return; }
        loadTutorsList();
      });
      const delTd = document.createElement('td');
      delTd.appendChild(removeBtn);

      tr.innerHTML = `<td>${row.full_name}</td><td>${row.day_assigned || ''}</td><td>${row.room_assigned || ''}</td>`;
      tr.appendChild(roleTd);
      tr.appendChild(delTd);
      body.appendChild(tr);
    });
  }

  editTutorsBtn.addEventListener('click', () => {
    if (!isHeadAdmin) return;
    loadTutorsList();
    openModal('modal-tutors');
  });

  document.getElementById('add-tutor-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const fd = new FormData(e.target);
    const confirmUsername = prompt('Enter a Head Admin username to confirm this addition:');
    if (!confirmUsername) return;
    const confirmPassword = prompt('Enter that Head Admin\'s password:');
    if (!confirmPassword) return;
    const { data, error } = await db.rpc('add', {
      p_full_name: fd.get('full_name').trim(),
      p_day_assigned: fd.get('day_assigned'),
      p_room_assigned: fd.get('room_assigned'),
      p_role: fd.get('role'),
      p_confirming_username: confirmUsername, p_confirming_password: confirmPassword
    });
    if (error) { alert('Could not add tutor: ' + error.message); return; }
    const result = data && data[0];
    e.target.reset();
    loadTutorsList();
    if (result) {
      alert(`Tutor added!\n\nUsername: ${result.new_username}\nPassword: ${result.new_password}\n\n` +
        `Write this down now — the password can't be retrieved again once you close this.`);
    }
  });

  /* ================= REVIEW APPLICATIONS ================= */
  const myLastName = adminSession.full_name.trim().split(' ').slice(-1)[0];

  async function loadApplicationsReview() {
    const panel = document.getElementById('panel-apps-review');
    panel.innerHTML = 'Loading...';
    const { data: apps, error } = await db.from('applications')
      .select('*').eq('status', 'pending')
      .contains('teacher_recommendations', [myLastName]);
    if (error) { panel.innerHTML = 'Could not load applications.'; console.error(error); return; }
    if (!apps || apps.length === 0) { panel.innerHTML = '<p style="color:var(--ink-soft);">No applications need your review right now.</p>'; return; }

    panel.innerHTML = '';
    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'panel';
      const gradesRows = (app.subject_grades || []).map(g => `<tr><td>${g.subject}</td><td>${g.teacher}</td><td>${g.grade}</td></tr>`).join('');
      card.innerHTML = `
        <p style="font-weight:700; margin-top:0;">${app.full_name} — Grade ${app.grade}, GPA ${app.gpa}</p>
        <table class="grid-table" style="margin-bottom:10px;">
          <thead><tr><th>Subject</th><th>Teacher</th><th>Grade</th></tr></thead>
          <tbody>${gradesRows}</tbody>
        </table>
        <div class="check-group">
          <label><input type="radio" name="rec-${app.id}" value="yes"> Recommend</label>
          <label><input type="radio" name="rec-${app.id}" value="no"> Not Recommend</label>
        </div>
        <label>Notes (optional):</label>
        <input type="text" class="notes-input">
        <br><br>
        <button class="btn submit-review-btn">Submit Review</button>
      `;
      card.querySelector('.submit-review-btn').addEventListener('click', async () => {
        const picked = card.querySelector(`input[name="rec-${app.id}"]:checked`);
        if (!picked) { alert('Pick Recommend or Not Recommend first.'); return; }
        const notes = card.querySelector('.notes-input').value.trim();
        const { error: revErr } = await db.from('application_reviews').upsert({
          application_id: app.id, teacher_last_name: myLastName,
          recommend: picked.value === 'yes', notes
        }, { onConflict: 'application_id,teacher_last_name' });
        if (revErr) { alert('Could not submit review: ' + revErr.message); return; }
        alert('Review submitted.');
      });
      panel.appendChild(card);
    });
  }

  async function loadApplicationsFinalize() {
    const panel = document.getElementById('panel-apps-finalize');
    panel.innerHTML = 'Loading...';
    const { data: apps, error } = await db.from('applications').select('*').eq('status', 'pending');
    if (error) { panel.innerHTML = 'Could not load applications.'; console.error(error); return; }
    if (!apps || apps.length === 0) { panel.innerHTML = '<p style="color:var(--ink-soft);">No pending applications.</p>'; return; }

    panel.innerHTML = '';
    for (const app of apps) {
      const { data: reviews } = await db.from('application_reviews').select('*').eq('application_id', app.id);
      const recCount = (reviews || []).filter(r => r.recommend).length;
      const gradesRows = (app.subject_grades || []).map(g => `<tr><td>${g.subject}</td><td>${g.teacher}</td><td>${g.grade}</td></tr>`).join('');
      const card = document.createElement('div');
      card.className = 'panel';
      card.innerHTML = `
        <p style="font-weight:700; margin-top:0;">${app.full_name} — Grade ${app.grade}, GPA ${app.gpa}</p>
        <p style="color:var(--ink-soft); font-size:0.85rem;">${recCount} of ${(reviews||[]).length} reviewers recommended so far</p>
        <table class="grid-table" style="margin-bottom:10px;">
          <thead><tr><th>Subject</th><th>Teacher</th><th>Grade</th></tr></thead>
          <tbody>${gradesRows}</tbody>
        </table>
        <label>Day Assigned:</label>
        <select class="finalize-day"><option>Tuesday</option><option>Wednesday</option><option>Thursday</option></select>
        <label>Room Assigned:</label>
        <select class="finalize-room"><option>Upper</option><option>Lower</option></select>
        <br><br>
        <button class="btn finalize-accept-btn">Accept</button>
        <button class="btn secondary finalize-reject-btn">Reject</button>
      `;
      card.querySelector('.finalize-accept-btn').addEventListener('click', async () => {
        const confirmPassword = prompt('Enter your Head Admin password to confirm:');
        if (!confirmPassword) return;
        const { data: tutorResult, error: addErr } = await db.rpc('add', {
          p_full_name: app.full_name,
          p_day_assigned: card.querySelector('.finalize-day').value,
          p_room_assigned: card.querySelector('.finalize-room').value,
          p_role: 'Tutor',
          p_confirming_username: adminSession.username,
          p_confirming_password: confirmPassword
        });
        if (addErr) { alert('Could not create tutor: ' + addErr.message); return; }
        await db.from('applications').update({ status: 'accepted' }).eq('id', app.id);
        const result = tutorResult && tutorResult[0];
        alert(`Accepted! New tutor account:\n\nUsername: ${result.new_username}\nPassword: ${result.new_password}`);
        loadApplicationsFinalize();
      });
      card.querySelector('.finalize-reject-btn').addEventListener('click', async () => {
        if (!confirm(`Reject ${app.full_name}'s application?`)) return;
        await db.from('applications').update({ status: 'rejected' }).eq('id', app.id);
        loadApplicationsFinalize();
      });
      panel.appendChild(card);
    }
  }

  document.getElementById('btn-review-apps').addEventListener('click', () => {
    loadApplicationsReview();
    if (isHeadAdmin) loadApplicationsFinalize();
    openModal('modal-apps');
  });
</script>
</body>
</html>
