<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor Applications</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="title-bar">Haas Hall Academy Bentonville Tutoring Program</div>
    <div class="subtitle-bar">Tutor Applications</div>

    <form class="panel" id="app-form">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="email">School Email:</label>
      <input type="email" id="email" name="email" required>

      <label>Grade: (Choose 1)</label>
      <div class="check-group">
        <label><input type="radio" name="grade" value="8" required> 8</label>
        <label><input type="radio" name="grade" value="9"> 9</label>
        <label><input type="radio" name="grade" value="10"> 10</label>
        <label><input type="radio" name="grade" value="11"> 11</label>
        <label><input type="radio" name="grade" value="12"> 12</label>
      </div>

      <label for="classes-select">Classes Taken: (Choose all that apply)</label>
      <select id="classes-select" name="classes" multiple required>
        <!-- populated by JS from CLASS_GROUPS below -->
      </select>

      <label for="teachers-select">Teacher Recommendation Signatures: (Choose all that apply)</label>
      <select id="teachers-select" name="teachers" multiple required>
        <!-- populated by JS from the TEACHERS list below -->
      </select>

      <label>Days Available: (Choose as many as possible)</label>
      <div class="check-group">
        <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
        <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
        <label><input type="checkbox" name="days" value="Thursday"> Thursday</label>
      </div>
    </form>

    <br>
    <button class="btn" type="submit" form="app-form">Submit</button>
    <br><br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

<script>
  // Real class & teacher lists, taken from the school schedule. Edit here if anything needs correcting.
  const CLASS_GROUPS = {
    'Math': [
      'Pre-Algebra', 'Algebra 1', 'Algebra 2', 'Geometry', 'Precalc/Trig',
      'AP Precalc', 'Calculus', 'AP Calc AB', 'AP Calc BC', 'AP Stats'
    ],
    'English': [
      '7 English', '8 English', 'English I', 'English II',
      'English III w/ Personal Comm', 'AP Lang', 'AP Lit', 'AP Seminar',
      'AP Research', 'Journalism'
    ],
    'Science': [
      '7 Science', '8 Science', 'Physical Science', 'Physics', 'AP Physics C',
      'Biology', 'AP Bio', 'AP Environmental Science', 'Chemistry',
      'Chemistry 2', 'Chemistry of Foods'
    ],
    'Computer Science': [
      '8 KC', 'Intro to Comp Sci', 'AP CSP', 'AP CSA', 'Game Development'
    ],
    'Social Studies': [
      '7 SS', '8 SS', 'Civics/Econ', 'AP US Gov', 'AP Micro/Macro',
      'Intro to Crim', 'CSI', 'World History', 'AP World', 'US History',
      'APUSH', 'AP Psych', 'AP Business'
    ],
    'Health Sciences': [
      '7 Career', '7 Health', '7 PE', '8 Health', '8 PE', 'Health',
      'A&P', 'Med Term', 'Recreational Sports', 'College & Career',
      'Personal Fitness'
    ],
    'Fine Arts': [
      '7 Theatre', '7 Art', '8 Art', 'Drawing 1', 'Painting 1',
      'Visual Art Foundations 1', 'Sculpture', 'Studio Art',
      'AP Art History'
    ],
    'World Languages': [
      'Spanish 1', 'Spanish 2', 'Spanish 3', 'AP Spanish Lang',
      'French 3', 'AP French Lang'
    ]
  };

  const TEACHERS = [
    'Longanecker', 'Pearce', 'Still', 'Powell', 'Passmore', 'Gilbert',
    'Golden', 'Ingram', 'Hamlin', 'Karras', 'Brophy', 'Smiley',
    'Parker', 'Turnbaugh', 'Cashion', 'Depner', 'Levings', 'Stringfellow',
    'Greenwood', 'Riggs', 'DeSpain'
  ];

  function buildSubjectOptions() {
    const select = document.getElementById('classes-select');
    Object.entries(CLASS_GROUPS).forEach(([groupName, items]) => {
      const group = document.createElement('optgroup');
      group.label = groupName;
      items.forEach(item => {
        const option = document.createElement('option');
        option.value = item;
        option.textContent = item;
        group.appendChild(option);
      });
      select.appendChild(group);
    });
  }

  function buildTeacherOptions() {
    const select = document.getElementById('teachers-select');
    TEACHERS.forEach(teacher => {
      const option = document.createElement('option');
      option.value = teacher;
      option.textContent = teacher;
      select.appendChild(option);
    });
  }

  buildSubjectOptions();
  buildTeacherOptions();

  document.getElementById('app-form').addEventListener('submit', function (e) {
    e.preventDefault();
    alert('Application submitted! (placeholder — this will write to Supabase once connected)');
  });
</script>
</body>
</html>
