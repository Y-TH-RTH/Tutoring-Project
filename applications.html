<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor Applications</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="title-bar">Haas Hall Academy Bentonville Tutoring Program</div>
    <div class="subtitle-bar">Tutor Applications</div>

    <form class="panel" id="app-form">
      <label for="fullname">Full Name:</label>
      <input type="text" id="fullname" name="fullname" required>

      <label for="email">School Email:</label>
      <input type="email" id="email" name="email" required>

      <label>Grade: (Choose 1)</label>
      <div class="check-group">
        <label><input type="radio" name="grade" value="8" required> 8</label>
        <label><input type="radio" name="grade" value="9"> 9</label>
        <label><input type="radio" name="grade" value="10"> 10</label>
        <label><input type="radio" name="grade" value="11"> 11</label>
        <label><input type="radio" name="grade" value="12"> 12</label>
      </div>

      <label>Classes Taken: (Choose all that apply)</label>
      <div class="check-group" id="classes-group">
        <!-- populated by JS from the CLASSES list below -->
      </div>

      <label>Teacher Recommendation Signatures: (Choose all that apply)</label>
      <div class="check-group" id="teachers-group">
        <!-- populated by JS from the TEACHERS list below -->
      </div>

      <label>Days Available: (Choose as many as possible)</label>
      <div class="check-group">
        <label><input type="checkbox" name="days" value="Tuesday"> Tuesday</label>
        <label><input type="checkbox" name="days" value="Wednesday"> Wednesday</label>
        <label><input type="checkbox" name="days" value="Thursday"> Thursday</label>
      </div>
    </form>

    <br>
    <button class="btn" type="submit" form="app-form">Submit</button>
    <br><br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

<script>
  // Real class & teacher lists, taken from the school schedule. Edit here if anything needs correcting.
  const CLASSES = [
    'Civics/Econ', '7 SS', '8 SS', 'AP Business Principles', 'AP Micro/Macro', 'AP US Gov',
    'Drawing 1', 'Visual Art Foundations I', 'Studio Art 2/3D', 'Painting I', 'AP Art History',
    '7 Art', '8 Art', 'Sculpture',
    'Spanish I', 'Spanish II', 'Spanish 3', 'AP Spanish', '7 Theatre', '7 Health', '8 Health',
    '7 PE', '8 PE', '8 KC', '7 Career', 'Recreational Sports/Personal Fitness',
    'English I Lang', 'English I Lit', 'English II Lang', 'English II Lit', 'English III Lit',
    'AP Lang', 'AP Lit', 'AP Psych', 'Journalism', 'AP Research', 'AP Seminar',
    '7 Lang', '7 Lit', '8 Lang', '8 Lit',
    'Med Term/Health', 'College & Career/Health', 'A & P',
    '7 Science', '8 Science', 'Chemistry', 'Chemistry II', 'Vocal Ensemble I', '8 Music',
    'Physical Science', 'Biology', 'AP Bio', 'AP Comp Sci A', 'AP Environmental Science',
    'CSI', 'Chem of Foods',
    'Intro to Comp Sci', 'Game Development', 'AP Comp Sci Principles', '8 Keycode/8KC',
    'Physics', 'AP Physics C: Mechanics',
    'Pre-Algebra A', 'Pre-Algebra B', 'Algebra 1', 'Algebra 2', 'Geometry',
    'French 3', 'AP French', 'AP Stats', 'Trig/PreCalc', 'AP PreCalc', 'Calculus',
    'AP Calc AB', 'AP Calc BC',
    'APUSH', 'Intro to Crim', 'World History', 'US History', 'AP World'
  ];
  const TEACHERS = [
    'Mr. Depner', 'Mrs. Levings', 'Ms. Stringfellow', 'Mrs. Greenwood', 'Riggs', 'Mrs. DeSpain',
    'Ms. Longanecker', 'Mrs. Pearce', 'Dr. Still', 'Meghan', 'Mr. Passmore', 'Nurse Shelly',
    'Mr. Golden', 'Ms. Ingram', 'Mr. Hamlin', 'Mr. Karras', 'Mrs. Brophy', 'Mr. Smiley',
    'Mr. Parker', 'Mr. Turnbaugh', 'Dr. Cashion'
  ];

  function buildCheckboxes(containerId, name, items) {
    const container = document.getElementById(containerId);
    items.forEach((item, i) => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.name = name;
      input.value = item;
      label.appendChild(input);
      label.appendChild(document.createTextNode(' ' + item));
      container.appendChild(label);
    });
  }

  buildCheckboxes('classes-group', 'classes', CLASSES);
  buildCheckboxes('teachers-group', 'teachers', TEACHERS);

  document.getElementById('app-form').addEventListener('submit', function (e) {
    e.preventDefault();
    alert('Application submitted! (placeholder — this will write to Supabase once connected)');
  });
</script>
</body>
</html>
