<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-top: 4px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 20px;
    text-align: center;
  }
  .stat-card .label { font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.03em; }
  .stat-card .value { font-size: 1.6rem; font-weight: 800; color: var(--blue-dark); margin-top: 6px; }
  .hero {
    background: var(--blue-soft);
    border-radius: 16px;
    padding: 28px 30px;
    margin-bottom: 20px;
  }
  .hero .name { font-size: 1.4rem; font-weight: 800; color: var(--blue-dark); }
  .hero .role-badge {
    display: inline-block; margin-top: 8px;
    background: var(--surface); border: 1px solid var(--blue-line);
    color: var(--blue-dark); font-weight: 600; font-size: 0.85rem;
    padding: 4px 12px; border-radius: 999px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="title-bar">Haas Hall Academy Bentonville Tutoring Program</div>
    <div id="session-bar" style="color:var(--ink-soft); font-size:0.85rem; margin:-6px 0 14px; text-align:right;"></div>

    <div class="hero">
      <div class="name" id="hero-name">—</div>
      <div class="role-badge" id="hero-role">—</div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="label">Day Assigned</div>
        <div class="value" id="stat-day">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Room Assigned</div>
        <div class="value" id="stat-room">—</div>
      </div>
      <div class="stat-card">
        <div class="label">Hours Volunteered</div>
        <div class="value" id="stat-hours">—</div>
      </div>
    </div>

    <br>
    <a class="back-link" href="home.html">&larr; Back to Home</a>
  </div>

<script>
  const tutorSessionRaw = sessionStorage.getItem('tutor_session');
  if (!tutorSessionRaw) {
    window.location.href = 'tutors.html';
  }
  const tutorSession = JSON.parse(tutorSessionRaw || '{}');

  document.getElementById('session-bar').innerHTML =
    `Logged in as ${tutorSession.username} &nbsp;|&nbsp; ` +
    `<a href="#" id="logout-link" style="color:var(--blue);">Log out</a>`;
  document.getElementById('logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    sessionStorage.removeItem('tutor_session');
    window.location.href = 'home.html';
  });

  document.getElementById('hero-name').textContent = tutorSession.full_name || '—';
  document.getElementById('hero-role').textContent = tutorSession.role || '—';
  document.getElementById('stat-day').textContent = tutorSession.day_assigned || '—';
  document.getElementById('stat-room').textContent = tutorSession.room_assigned || '—';
  document.getElementById('stat-hours').textContent = (tutorSession.hours_volunteered ?? '—');
</script>
</body>
</html>
